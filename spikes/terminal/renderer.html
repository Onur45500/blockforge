<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net"
    />
    <title>Blockforge Terminal Spike</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #0f1419;
        color: #e7ecf1;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #243041;
      }
      button {
        background: #1e2a3a;
        color: #e7ecf1;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #term {
        height: calc(100% - 48px);
        padding: 8px;
      }
      .warn {
        font-size: 12px;
        color: #9fb0c3;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Terminal spike</strong>
      <button id="start">Start</button>
      <button id="stop">Stop</button>
      <span class="warn"
        >Claude Code via Git Bash · permissions prompts kept · no
        --dangerously-skip-permissions</span
      >
    </header>
    <div id="term"></div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
