name: CI

on:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install
        run: pnpm install

      - name: Verify version bump script
        run: node --test scripts/ci-prepare-release.test.mjs

      - name: Build open-cloud
        run: pnpm --filter @blockforge/open-cloud build

      - name: Ingest asset catalog
        run: pnpm --filter @blockforge/asset-bank ingest

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: |
          pnpm --filter @blockforge/open-cloud typecheck
          pnpm --filter @blockforge/desktop typecheck
          pnpm --filter @blockforge/asset-bank typecheck

      - name: Install and compile project-template
        working-directory: packages/project-template
        run: |
          npm install
          npx rbxtsc

      - name: Pipeline spike (compile + rojo build)
        run: pnpm spike:pipeline
        env:
          # Live Open Cloud optional — leave unset in CI
          CI: true

      - name: Desktop Playwright static smoke
        working-directory: apps/desktop
        run: pnpm test:e2e
